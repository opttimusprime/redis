apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
  labels:
    app: redis
    project: roboshop
    tier: db
    
spec:
  clusterIP: None
  selector:
    app: redis
    project: roboshop
    tier: db
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379