apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  labels:
    app: redis
    project: roboshop
    tier: db
spec:
  type: ClusterIP
  selector:
    app: redis
    project: roboshop
    tier: db
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379