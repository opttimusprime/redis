replicaCount: 1

image:
  repository: redis
  tag: "6.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 6379

persistence:
  enabled: true
  storageClass: gp3
  size: 1Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

redis:
  appendonly: "yes"
  bind: "0.0.0.0"

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreName: aws-secretsmanager
  secretStoreKind: ClusterSecretStore
  awsSecretName: roboshop/dev/redis
  targetSecretName: redis-secret